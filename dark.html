<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Formatter</title>
<style>
    * {
                margin: 0;
                    padding: 0;
                        box-sizing: border-box;
                            font-family: Arial, sans-serif;
                            }
        
                            body {
                                background: #000;
                                    display: flex;
                                        justify-content: center;
                                            align-items: center;
                                                height: 100vh;
                                                    accent-color: #00C853; /* Android selection handles green */
                                                }
        
                                                    .container {
                                                       width: 95%;
                                                 max-width: 500px;
                                                                background: #000;
                                                                 border-radius: 20px;
                                                                        padding: 25px;
                                                                            box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
                                                                            }
        
                                                                            h1 {
                                                                             text-align: center;
                                                                                    color: #FFF;
                                                                                    }
        
                                                                                    p {
                                                                                        text-align: center;
                                                                                            color: #666;
                                                                                                margin-top: 5px;
                                                                                                   margin-bottom: 20px;
                                                                                                    }
                                                                              .toolbar{
                                                                                                        display: flex;
                                                                                                            justify-content: center;
                                                                                                                gap: 10px;
                                                                                                                    flex-wrap: wrap;
                                                                                                                    margin:10px;
        
                                                             }                                                     .toolbar button {
                                                                                                                            width: 100px;
                                                                                                                                height: 45px;
                                                                                                                                    border: none;
                                                                                                                                        border-radius: 10px;
                                                                                                                                            background: #25D366;
                                                                                                                                            color: #fff;
                                                                                                                                                   font-size: 18px;
                                                                                                                                                        font-weight: bold;
                                                                                                                                                            cursor: pointer;
                                                                                                                                                            }
        
                                                                                                                                                            textarea {
                                                                                                                                                                width: 100%;
                                                                                                                                                                    height: 180px;
                                                                                                                                                                        padding: 15px;
                                                                                                                                                                            font-size: 18px;
                                                                                                                                                                                border: 2px solid #25D366;
                                                                                                                                                                                    border-radius: 10px;
                                                                                                                                                                                        outline: none;
                                                                                                                                                                                            resize: none;
                                                                                                                                                                                        
                                                                                                  
                                                                                                                                                              BACKGROUND:BLACK;
                                                                                                                                                                                                    caret-color: #25D366; /* Bright Green Cursor */
                                                                                                                                                                                                        color:white;
                                                                                                                                                                                                        }
        
                                                                                                                                                                                                    /* Selected Text + Selection Handles Background */
                                                                                                                                                                                                        textarea::selection {
                                                                                                                                                                                                            background: #25D366; /* Light Green background */
                                                                                                                                                                                                                color: #fff; /* Black text on selection */
                                                                                                                                                                                                                }
        
                                                                                                                                                                                                                .send {
                                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                                        height: 55px;
                                                                                                                                                                                                                        margin-top: 20px;
                                                                                                                                                                                                                                border: none;
                                                                                                                                                                                                                                    border-radius: 10px;
                                                                                                                                                                                                                                        background: #25D366;
                                                                                                                                                                                                                                            color: #fff;
                                                                                                                                                                                                                                                font-size: 22px;
                                                                                                                                                                                                                                                cursor: pointer;
                                                                                                                                                                                                                                                    }
        
                                                                                                                                                                                                                                                  .preview {
                                                                                                                                                                                                                                                        margin-top: 20px;
                                                                                                                                                                                                                                                            padding: 15px;
                                                                                                                                                                                                                                                                border-radius: 10px;
                                                                                                                                                                                                                                                                BORDER:SOLID #25D366 2PX;
                                                                                                                                                                                                                                                                    background: #000;
                                                                                                                                                                                                                                                                        font-size: 18px;
                                                                                                                                                                                                                                                                            word-wrap: break-word;
                                                                                                                                                                                                                                                                            }
        
                                                                                                                                                                                                                                .preview h3 {
                                                                                                                                                                                                                                 margin-bottom: 10px;
                                                                                                                                                                                                                          color: #25D366;
                                        
    }
    </style>
<head>
</head>
<body>

<div class="container">
<h1>WhatsApp</h1>
<p>Text Editor</p>
<div class="toolbar">
<button onclick="insertTag('b')"><b>BOLD</b></button>
<button onclick="insertTag('i')"><i>ITALIC</i></button>
<button onclick="insertTag('s')">STRIKE</button>
</div>
<textarea id="msg" placeholder="Type your message..." onkeyup="previewText()"></textarea>

<div class="preview">
<h3>Preview</h3>
<div id="preview"></div>
</div>
<button class="send" onclick="shareText()">
Share
</button>
<button 
  style="width:200px; height:60px; background:#25D366; border:none; margin:50px; border-radius:10px; font-size:20px;">
    <a href="./index.html" style="text-decoration:none; color:#fff;">Light Mode</a>
</button>
</div>
<script src="script.js"></script>


</body>
</html>
